services:
  php:
    build: .
    volumes:
      - .:/app
      # Ce volume empêche ton dossier local (vide) d'écraser le vendor généré dans l'image
      - /app/vendor/
    working_dir: /app
    # On laisse Nginx gérer les ports vers l'extérieur. 
    # Le container PHP communique en interne via le port 9000.
    environment:
      - SERVER_NAME=:80
      - PHP_EXTENSIONS=pdo_pgsql pgsql
      - DATABASE_URL=postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-!ChangeMe!}@database:5432/${POSTGRES_DB:-app}?serverVersion=16&charset=utf8
    # On installe les dépendances au démarrage pour être sûr que l'autoloader existe
    command: >
      sh -c "composer install --no-interaction --optimize-autoloader && php-fpm"

  nginx:
    image: nginx:alpine
    ports:
      - "8081:80" # Ton site sera sur http://localhost:8081
    volumes:
      - .:/app
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql/data:rw

volumes:
  database_data: